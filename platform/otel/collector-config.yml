# OpenTelemetry Collector — Phase 0
# Receives traces from all apps, routes to backends
# Traces: dropped (no Tempo yet) — SDK instrumented from day 0
# Logs: forward to Loki
# Metrics: forward to Prometheus scrape endpoint

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  resource:
    attributes:
      - key: environment
        value: local
        action: upsert
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s

exporters:
  # Traces: discard for now (Phase 1 will add Tempo)
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 100

  # Logs: forward to Loki via native OTLP ingestion (Loki 3.x, endpoint
  # POST /otlp/v1/logs). Changed 2026-09-15 (infra-full-upgrade-2026-09,
  # Lote 3+5) -- the dedicated `loki` exporter was deleted from
  # opentelemetry-collector-contrib (confirmed: exporter/lokiexporter
  # directory 404s at tag v0.160.0 on GitHub, it existed pre-upgrade at
  # 0.103.0), deprecated upstream in favor of Loki's own native OTLP
  # endpoint (available since Loki 3.0 -- coupled to the Loki bump in the
  # same lote, not independently schedulable).
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Metrics: expose for Prometheus scrape
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel

service:
  # Self-metrics endpoint (0.0.0.0:8888, scraped by prometheus.yml job
  # `otel-collector`) explicit since 2026-09-15 (infra-full-upgrade-2026-09,
  # Lote 3) -- collector >=0.123.0 ignores the old `telemetry.metrics.address`
  # key entirely (was silently dropping the endpoint here after the bump
  # from 0.103.0, confirmed via a real down target in Prometheus, not
  # assumed from the changelog alone). New syntax below is the only one
  # that still works.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
