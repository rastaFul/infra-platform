# infra-platform/platform/docker-compose.yml
# Shared observability + secrets platform — single stack, single source of
# truth. Consolidated 2026-08-27 from two previously-separate stacks
# (services/platform: Grafana/InfluxDB/Loki/GlitchTip, created 06/2026;
# infra-platform/platform: Vault/OTEL, created 08/2026) that were never
# merged — see docs/explanation/adr/010-platform-stack-consolidation.md.
#
# Start: docker compose --env-file .env up -d
#
# restart: always everywhere in this file (not unless-stopped, changed
# 2026-09-09) -- local dev machine, user stops/starts Docker Desktop itself
# (e.g. to play a game) and expects the whole stack back automatically.
# `unless-stopped` doesn't resurrect a container that was already Exited
# (crashed on its own) before the daemon went down; `always` does regardless.
# See infra-platform .specs/audit/execution.md (2026-09-09).

networks:
  platform_net:
    name: platform_net
    driver: bridge

volumes:
  # Pinned via explicit `name:` to the exact volume names already in use
  # (project directory has been renamed multiple times historically —
  # Compose derives volume names from the directory basename by default,
  # which silently orphaned data 2-3 times before. Never again: pin it.)
  vault_data:
    name: platform_vault_data
  vault_logs:
    name: platform_vault_logs
  influx_data:
    name: platform_influx_data
  grafana_data:
    name: platform_grafana_data
  loki_data:
    name: platform_loki_data
  prometheus_data:
    name: platform_prometheus_data
  glitchtip_postgres_data:
    name: platform_glitchtip_postgres_data # pg16, kept as rollback, unused after Lote 8
  glitchtip_postgres_data_pg18:
    name: platform_glitchtip_postgres_data_pg18
  glitchtip_uploads:
    name: platform_glitchtip_uploads
  influx3_data:
    name: platform_influx3_data
  influx3_plugins:
    name: platform_influx3_plugins

services:
  # ── Secrets ────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:2.1.0
    container_name: platform-vault
    networks:
      - platform_net
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/policies:/vault/policies:ro
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://vault:8200
    cap_add:
      - IPC_LOCK
    command: server
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 2>&1 | grep -E 'Initialized|sealed' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # ── Telemetry pipeline ────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: platform-otel-collector
    networks:
      - platform_net
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8888:8888"   # Collector self-metrics
      - "127.0.0.1:8889:8889"   # Prometheus exporter (app metrics via OTEL)
    volumes:
      - ./otel/collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No Docker-level HEALTHCHECK: otel/opentelemetry-collector-contrib is a
    # distroless image — no shell, no wget/curl, nothing to exec a probe with
    # (confirmed 2026-08-27: `docker exec ... wget` -> exit 127, `sh` -> exit
    # 127 too). Was silently reporting "unhealthy" despite the endpoint
    # responding 200 from the host the whole time. Liveness is covered
    # instead by Prometheus's own scrape target health (job `otel-collector`
    # in prometheus.yml) — `up{job="otel-collector"}` is the real signal.
    restart: always

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: platform-prometheus
    networks:
      - platform_net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: always

  # kept running deliberately as rollback during the v3 migration below
  # (D3, infra-full-upgrade-2026-09) -- decommission only after dashboards
  # + telegraf writes are confirmed healthy against influxdb3 for a while.
  influxdb:
    image: influxdb:2.7
    container_name: platform-influxdb
    networks:
      - platform_net
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=platform
      - DOCKER_INFLUXDB_INIT_BUCKET=sensors
      - DOCKER_INFLUXDB_INIT_RETENTION=90d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # InfluxDB 3 Core (2026-09-15, infra-full-upgrade-2026-09, D3 -- full
  # engine migration, not a version bump: Rust rewrite, Flux removed,
  # SQL/InfluxQL only). Write path unchanged for Telegraf (`/api/v2/write`
  # compat endpoint accepts outputs.influxdb_v2 as-is, confirmed via
  # InfluxData docs). Query path (Grafana dashboards) rewritten Flux->SQL,
  # see dashboards/*.json and datasources.yml.
  influxdb3:
    image: influxdb:3-core
    container_name: platform-influxdb3
    networks:
      - platform_net
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - influx3_data:/var/lib/influxdb3/data
      - influx3_plugins:/var/lib/influxdb3/plugins
    command:
      - influxdb3
      - serve
      - --node-id=platform-influxdb3
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    environment:
      - INFLUXDB3_ADMIN_TOKEN=${INFLUXDB3_ADMIN_TOKEN}
    healthcheck:
      # /health requires auth on InfluxDB 3 Core (no anonymous endpoint at
      # all, confirmed real -- unauthenticated curl gets 401, container
      # showed `unhealthy` for the container's whole lifetime until this
      # fix even though it was fully functional the entire time, same class
      # of "healthcheck lies" bug as otel-collector/loki above but for the
      # opposite reason -- here it's a real endpoint, just needs a header).
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$INFLUXDB3_ADMIN_TOKEN\" http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  loki:
    image: grafana/loki:3.7.7
    container_name: platform-loki
    networks:
      - platform_net
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    # No Docker-level HEALTHCHECK since 3.7.7 (bump 2026-09-15, infra-full-
    # upgrade-2026-09 Lote 3+5): Loki removed BusyBox from its image as of
    # 3.5.8 (no /bin/sh, wget, cat, ls -- verified empirically against this
    # image, same class of issue already documented above for
    # otel-collector). `wget --spider` used here before 3.x can no longer
    # exec inside the container. Liveness for `grafana`'s depends_on is now
    # `service_started` (see below), not `service_healthy` -- Grafana's
    # Loki datasource just retries on first dashboard load if not ready yet,
    # not fatal at boot, same tradeoff otel-collector already accepted.
    restart: always

  # ── Dashboards ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.1
    container_name: platform-grafana
    networks:
      - platform_net
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      influxdb:
        condition: service_healthy
      loki:
        condition: service_started # no HEALTHCHECK since 3.7.7, see comment above
      prometheus:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://metrics.rastaful.dev
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-noreply@rastaful.dev}
      - INFLUXDB_TOKEN_MICROGROW=${INFLUXDB_TOKEN_MICROGROW}
      - INFLUXDB_TOKEN_RASTAFINANCAS=${INFLUXDB_TOKEN_RASTAFINANCAS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # ── Error tracking ─────────────────────────────────────────────────
  glitchtip-db:
    image: postgres:18-alpine
    container_name: platform-glitchtip-db
    networks:
      - platform_net
    volumes:
      # New volume (2026-09-15, infra-full-upgrade-2026-09 Lote 8): Postgres
      # major version bumps are not in-place, need a fresh initdb + restore.
      # Old volume `platform_glitchtip_postgres_data` (pg16 data files) kept
      # untouched as rollback, not deleted -- see execution.md for the
      # rollback procedure if this needs reverting.
      #
      # Mount point changed to the PARENT dir (`/var/lib/postgresql`, not
      # `.../data`) -- real bug hit on first boot: postgres 18+ official
      # images refuse to start with a volume mounted directly at
      # `/var/lib/postgresql/data` on a fresh/empty volume (guard added
      # upstream for pg_upgrade --link support, see docker-library/postgres
      # #37 and #1259). The image manages the `data` subdirectory itself now.
      - glitchtip_postgres_data_pg18:/var/lib/postgresql
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  glitchtip-redis:
    image: redis:8-alpine
    container_name: platform-glitchtip-redis
    networks:
      - platform_net
    restart: always

  glitchtip:
    # Pinned (not :latest) — v4.2.4+ confirmed multi-arch/arm64, required
    # for the oci-free environment (ADR 007). Never bump without re-running
    # the docker build/compose gate.
    image: glitchtip/glitchtip:v6
    container_name: platform-glitchtip
    networks:
      - platform_net
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    volumes:
      - glitchtip_uploads:/code/uploads
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@platform-glitchtip-db:5432/glitchtip
      REDIS_URL: redis://platform-glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: 8000
      EMAIL_URL: "consolemail://"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8010}
      DEFAULT_FROM_EMAIL: ${SMTP_FROM:-noreply@rastaful.dev}
      CELERY_WORKER_CONCURRENCY: 2
    restart: always

  glitchtip-worker:
    image: glitchtip/glitchtip:v6
    container_name: platform-glitchtip-worker
    networks:
      - platform_net
    depends_on:
      - glitchtip-db
      - glitchtip-redis
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@platform-glitchtip-db:5432/glitchtip
      REDIS_URL: redis://platform-glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      CELERY_WORKER_CONCURRENCY: 2
    restart: always
