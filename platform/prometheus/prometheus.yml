# Prometheus — Phase 0
# Scrapes: OTEL Collector (app+collector metrics forwarded from OTEL SDK)
#          + each API's own /metrics (prom-client), directly via
#          host.docker.internal:PORT (containers publish to 127.0.0.1:PORT
#          since Batch 3's PM2→Docker Compose migration — comment corrected
#          2026-09-09, was stale since referring to the pre-migration PM2 setup).
# See infra-platform/docs/explanation/adr/009-caddy-deferred-prometheus-added.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
      - targets: ['otel-collector:8888']
        labels:
          source: collector-self-metrics

  # Loki self-metrics — não existe HEALTHCHECK de Docker pra este serviço
  # (imagem 3.7.7 sem shell/wget/curl desde 3.5.8, ver comentário no
  # docker-compose.yml do platform). Monitoramento externo via Prometheus é
  # o substituto: pega `up` (scrape falhando) e `process_start_time_seconds`
  # (detecta crash-loop mesmo quando o scrape individual "passa" por sorte
  # de bater entre um crash e outro). Incidente real 2026-09-17: 32h de
  # crash-loop sem nenhum alerta — ver .specs/project/DECISIONS.md D-2026-09-17-1.
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { service: platform-loki }

  # Host-mapped services (PM2, not yet containerized) — reached via
  # host.docker.internal, same pattern already used by grafana/otel-collector.
  #
  # authorization/credentials_file: required since 2026-08-28 (security
  # hardening — see infra-platform .specs/features/security-hardening-phase1).
  # An IP allowlist alone does NOT work here: host.docker.internal traffic
  # is NAT'd to look like 127.0.0.1 on WSL2/Docker Desktop, so any
  # container on the host could otherwise read /metrics. The token file
  # is gitignored, never committed — see prometheus/metrics_token.example.
  - job_name: apis-host
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels: { service: rastafinancas-api }
      - targets: ['host.docker.internal:3006']
        labels: { service: artists-api }
      - targets: ['host.docker.internal:4000']
        labels: { service: microgrow-api }
    metrics_path: /metrics

  # vetcare — job separado porque a rota é /api/metrics (Next.js App Router,
  # não Fastify — não dá pra reusar o job acima, que fixa metrics_path:
  # /metrics pra todos os targets de dentro dele). Mesmo token compartilhado
  # (metrics_token), ver vetcare/.specs/features/observability-metrics/spec.md.
  - job_name: vetcare
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:3004']
        labels: { service: vetcare }
