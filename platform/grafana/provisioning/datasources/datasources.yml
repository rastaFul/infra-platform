apiVersion: 1
datasources:
  # Switched from InfluxDB 2.7 (Flux) to InfluxDB 3 Core (SQL) 2026-09-15
  # (infra-full-upgrade-2026-09, D3). Old datasources kept below (commented
  # out, not deleted) purely as documentation of the previous config -- the
  # old `influxdb` 2.7 container is still running as rollback (see
  # platform/docker-compose.yml comment) but no dashboard points at it
  # anymore after this change; re-enable if a full rollback is needed.
  - uid: influxdb-microgrow
    name: InfluxDB — MicroGrow
    type: influxdb
    access: proxy
    url: http://influxdb3:8181
    jsonData:
      version: SQL
      dbName: sensors
      httpMode: POST
      insecureGrpc: true # plain gRPC, no TLS -- same as every other internal service here
    secureJsonData:
      token: ${INFLUXDB_TOKEN_MICROGROW}
    isDefault: true

  - uid: influxdb-rastafinancas
    name: InfluxDB — RastaFinancas
    type: influxdb
    access: proxy
    url: http://influxdb3:8181
    jsonData:
      version: SQL
      dbName: rastafinancas
      httpMode: POST
      insecureGrpc: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN_RASTAFINANCAS}
    isDefault: false

  - uid: loki-platform
    name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000

  - uid: prometheus-platform
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
