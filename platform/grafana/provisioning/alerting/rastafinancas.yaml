apiVersion: 1
groups:
  - orgId: 1
    name: rastafinancas-p0-critical
    folder: RastaFinancas Alerts
    interval: 1m
    rules:
      - uid: rasta-api-down
        title: "RastaFinancas API Offline"
        condition: C
        for: 3m
        labels:
          severity: critical
          project: rastafinancas
          component: api
        annotations:
          summary: "API não está respondendo há 3 minutos"
          description: "Verificar: pm2 status rastafinancas-api | pm2 logs rastafinancas-api"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-rastafinancas
            model:
              refId: A
              rawSql: |
                SELECT result_code AS value FROM http_response
                WHERE probe = 'api-local' AND time >= now() - INTERVAL '3 minutes'
                ORDER BY time DESC LIMIT 1
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: rasta-error-rate-critical
        title: "RastaFinancas — Taxa de Erro 5xx > 1%"
        condition: C
        for: 5m
        labels:
          severity: critical
          project: rastafinancas
          component: api
        annotations:
          summary: "Taxa de erros 5xx acima de 1% nos últimos 5 minutos"
          description: "Verificar: pm2 logs rastafinancas-api | Grafana → API Performance"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-rastafinancas
            model:
              refId: A
              rawSql: |
                WITH errors AS (
                  SELECT SUM(counter) AS val FROM http_requests_total
                  WHERE status_code LIKE '5%' AND time >= now() - INTERVAL '5 minutes'
                ),
                total AS (
                  SELECT SUM(counter) AS val FROM http_requests_total
                  WHERE time >= now() - INTERVAL '5 minutes'
                )
                SELECT CASE WHEN total.val > 0
                  THEN COALESCE(errors.val, 0.0) / total.val * 100.0
                  ELSE 0.0 END AS value
                FROM errors, total
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1.0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

  - orgId: 1
    name: rastafinancas-p1-warning
    folder: RastaFinancas Alerts
    interval: 2m
    rules:
      - uid: rasta-latency-p95
        title: "RastaFinancas — Latência p95 > 1s"
        condition: C
        for: 5m
        labels:
          severity: warning
          project: rastafinancas
          component: api
        annotations:
          summary: "p95 de latência acima de 1 segundo nos últimos 5 minutos"
          description: "Verificar: Grafana → API Performance dashboard"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-rastafinancas
            model:
              refId: A
              rawSql: |
                -- p95 real via buckets do histograma (mesma técnica de
                -- rasta-api-performance.json -- bucket com menor boundary cuja
                -- contagem cumulativa >= 95% do total). Soma os buckets entre
                -- rotas/métodos antes de calcular, igual o Flux original fazia
                -- (group por _field + sum, sem quebrar por série).
                WITH latest AS (
                  SELECT "5", "10", "25", "50", "100", "250", "500", "1000", "2500", "+Inf",
                    ROW_NUMBER() OVER (PARTITION BY route, method, status_code ORDER BY time DESC) AS rn
                  FROM http_request_duration_ms
                  WHERE time >= now() - INTERVAL '5 minutes'
                ),
                summed AS (
                  SELECT SUM("5") AS b5, SUM("10") AS b10, SUM("25") AS b25, SUM("50") AS b50,
                    SUM("100") AS b100, SUM("250") AS b250, SUM("500") AS b500,
                    SUM("1000") AS b1000, SUM("2500") AS b2500, SUM("+Inf") AS binf
                  FROM latest WHERE rn = 1
                )
                SELECT CASE
                  WHEN binf IS NULL OR binf = 0 THEN 0.0
                  WHEN b5 >= binf * 0.95 THEN 5.0
                  WHEN b10 >= binf * 0.95 THEN 10.0
                  WHEN b25 >= binf * 0.95 THEN 25.0
                  WHEN b50 >= binf * 0.95 THEN 50.0
                  WHEN b100 >= binf * 0.95 THEN 100.0
                  WHEN b250 >= binf * 0.95 THEN 250.0
                  WHEN b500 >= binf * 0.95 THEN 500.0
                  WHEN b1000 >= binf * 0.95 THEN 1000.0
                  WHEN b2500 >= binf * 0.95 THEN 2500.0
                  ELSE 5000.0
                END AS value
                FROM summed
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: rasta-import-errors
        title: "RastaFinancas — Falhas de Import > 3 em 15min"
        condition: C
        for: 0m
        labels:
          severity: warning
          project: rastafinancas
          component: extrato
        annotations:
          summary: "Mais de 3 falhas de importação de extrato em 15 minutos"
          description: "Verificar: Grafana → Product Metrics | pm2 logs rastafinancas-api"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: influxdb-rastafinancas
            model:
              refId: A
              # Bug real corrigido 2026-09-17 (D-2026-09-17-5): a query original (herdada da
              # tradução Flux->SQL) contava AMOSTRAS de scrape de rasta_import_transactions_total
              # (~60 em 15min, sempre > 3, sempre disparava) -- métrica errada, sem nenhuma relação
              # com falha. A métrica certa já existe no código do produto
              # (apps/api/src/plugins/product-metrics.ts:56, rasta_import_batch_total, labels
              # format+status) desde antes -- confirmado, não é instrumentação faltando, só a regra
              # de alerta nunca foi ligada nela. Increase real do contador (MAX-MIN no período), não
              # contagem de amostras.
              rawSql: |
                SELECT COALESCE(MAX(counter) - MIN(counter), 0) AS value
                FROM rasta_import_batch_total
                WHERE status = 'error' AND time >= now() - INTERVAL '15 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: rasta-notif-job-down
        title: "RastaFinancas — Notification Job sem execução > 2h"
        condition: C
        for: 2h
        labels:
          severity: warning
          project: rastafinancas
          component: jobs
        annotations:
          summary: "Nenhum notification job executado nas últimas 2 horas"
          description: "Verificar: pm2 logs rastafinancas-api | cron job pode estar falhando silenciosamente"
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: influxdb-rastafinancas
            model:
              refId: A
              rawSql: |
                SELECT COUNT(counter) AS value FROM rasta_notification_job_runs_total
                WHERE time >= now() - INTERVAL '2 hours'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: rasta-web-down
        title: "RastaFinancas Web Offline"
        condition: C
        for: 3m
        labels:
          severity: critical
          project: rastafinancas
          component: web
        annotations:
          summary: "Frontend web não está respondendo à probe pública"
          description: "Verificar: pm2 status rastafinancas-web | CloudFlare tunnel status"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-rastafinancas
            model:
              refId: A
              rawSql: |
                SELECT result_code AS value FROM http_response
                WHERE probe = 'web-public' AND time >= now() - INTERVAL '3 minutes'
                ORDER BY time DESC LIMIT 1
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions
