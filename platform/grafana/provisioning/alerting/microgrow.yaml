              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT level_pct AS value FROM reservoir
                WHERE source = 'sim' AND time >= now() - INTERVAL '5 minutes'
                ORDER BY time DESC LIMIT 1
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
