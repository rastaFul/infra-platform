apiVersion: 1
groups:
  - orgId: 1
    name: microgrow-p0-critical
    folder: MicroGrow Alerts
    interval: 1m
    rules:
      - uid: alert-soil-offline
        title: "Solo Offline — Sem leituras > 5min"
        condition: C
        for: 5m
        labels:
          severity: critical
          component: sensor
        annotations:
          summary: "Sensores de solo sem dados há mais de 5 minutos"
          description: "Verificar conexão MQTT, simulador ou hardware ESP32"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT COUNT(vwc_pct) AS value FROM soil_moisture
                WHERE source = 'sim' AND time >= now() - INTERVAL '5 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-reservoir-critical
        title: "Reservatório Crítico < 10%"
        condition: C
        for: 2m
        labels:
          severity: critical
          component: reservoir
        annotations:
          summary: "Nível do reservatório abaixo de 10%"
          description: "Reabastecer imediatamente para evitar falha de irrigação"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT level_pct AS value FROM reservoir
                WHERE source = 'sim' AND time >= now() - INTERVAL '2 minutes'
                ORDER BY time DESC LIMIT 1
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [10]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-api-down
        title: "API Offline — Sem métricas > 3min"
        condition: C
        for: 3m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API não está publicando métricas"
          description: "Verificar: pm2 status microgrow-api | pm2 logs microgrow-api"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT COUNT(*) AS value FROM api_metrics
                WHERE time >= now() - INTERVAL '3 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

