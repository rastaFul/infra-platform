      - uid: alert-vwc-critical
        title: "VWC Crítico — Solo < 20%"
        condition: C
        for: 10m
        labels:
          severity: warning
          component: sensor
        annotations:
          summary: "VWC médio abaixo de 20% por mais de 10 minutos"
          description: "Planta em estresse hídrico. Verificar sistema de irrigação e reservatório."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT AVG(vwc_pct) AS value FROM soil_moisture
                WHERE source = 'sim' AND time >= now() - INTERVAL '10 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [20]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-mqtt-broker-down
        title: "Broker MQTT sem clientes"
        condition: C
        for: 3m
        labels:
          severity: warning
          component: mqtt
        annotations:
          summary: "Mosquitto sem clientes conectados há 3 minutos"
          description: "Verificar container mosquitto: docker ps | docker logs microgrow-mosquitto"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT value FROM mqtt_broker
                WHERE sys_topic = '$SYS/broker/clients/connected'
                  AND time >= now() - INTERVAL '3 minutes'
                ORDER BY time DESC LIMIT 1
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-irrigation-blocked
        title: "Irrigação Bloqueada > 30min"
        condition: C
        for: 30m
        labels:
          severity: warning
          component: irrigation
        annotations:
          summary: "Sistema quer irrigar mas reservatório vazio há > 30min"
          description: "Score alto + decision=BLOCKED. Planta precisa de água."
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT COUNT(score) AS value FROM hydric_score
                WHERE decision = 'BLOCKED' AND time >= now() - INTERVAL '30 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-api-latency
        title: "API Latência Alta p95 > 1s"
        condition: C
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API com p95 de latência acima de 1 segundo"
          description: "Investigar gargalos. Ver logs: pm2 logs microgrow-api"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT AVG(p95_latency_ms) AS value FROM api_metrics
                WHERE time >= now() - INTERVAL '5 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

  - orgId: 1
    name: microgrow-p0-reservoir-sensor
    folder: MicroGrow Alerts
    interval: 2m
    rules:
      - uid: alert-reservoir-sensor-stuck
        title: "Reservatório — Sensor Não Reagiu à Irrigação"
        condition: C
        for: 0m
        labels:
          severity: critical
          component: reservoir
        annotations:
          summary: "Nível do reservatório não variou nas 2h após uma ativação real da bomba"
          description: "Verificar: cabo do sensor, posição do flutuador, entupimento."
        data:
          # Fix 2026-09-21 (achado registrado em D-2026-09-18-3, agora corrigido): a versão
          # anterior desta query checava só "STDDEV(level_pct) < 0.1 nas últimas 2h", sem olhar
          # se a bomba rodou nesse intervalo -- ou seja, disparava TODO dia durante os ~23h
          # normais entre irrigações reais (cadência real observada ~25h, não 2h), porque nível
          # parado sem bomba rodando é o comportamento ESPERADO, não uma falha de sensor. A nova
          # versão só avalia STDDEV(level_pct) na janela de 2h logo APÓS a última ativação real
          # da bomba (`pump_events.active=true`, mesmo tag `mqtt_source='sim'` usado pra isolar
          # real/sim desde D-2026-09-17-7) -- sem pump event recente (janela de 2h-3h atrás), a
          # query retorna NULL e o alerta fica Normal/NoData, nunca falso-positivo. Sintaxe
          # (CTE + subquery escalar) testada ao vivo contra o InfluxDB3/DataFusion real antes de
          # aplicar (`docker exec platform-influxdb3 curl .../query_sql`), não assumida.
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                WITH last_pump AS (
                  SELECT MAX(time) AS pump_time FROM pump_events
                  WHERE active = true AND mqtt_source = 'sim'
                )
                SELECT STDDEV(r.level_pct) AS value FROM reservoir r
                WHERE r.source = 'sim'
                  AND r.time >= (SELECT pump_time FROM last_pump)
                  AND r.time <= (SELECT pump_time FROM last_pump) + INTERVAL '2 hours'
                  AND (SELECT pump_time FROM last_pump)
                    BETWEEN now() - INTERVAL '3 hours' AND now() - INTERVAL '2 hours'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0.1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-reservoir-sensor-suspect
        title: "Reservatório — Sensor Não Registrou Drenagem"
        condition: C
        for: 0m
        labels:
          severity: warning
          component: reservoir
        annotations:
          summary: "Bomba rodou >10s mas nível não caiu (sensor_suspect=true)"
          description: "Verificar posição do sensor, nível de água, conexões."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              # Bug real corrigido 2026-09-18: sensor_suspect é tag (Telegraf
              # tag_keys), armazenado como string "true"/"false" no InfluxDB 3
              # (Dictionary(Int32,Utf8), confirmado via information_schema.columns
              # + dado real). Comparar com `1.0` nunca dá erro (DataFusion permite
              # a comparação) mas NUNCA bate com nada -- falso negativo silencioso,
              # o alerta jamais dispararia mesmo com o evento real acontecendo.
              rawSql: |
                SELECT COUNT(*) AS value FROM reservoir_drain_event
                WHERE sensor_suspect = 'true' AND time >= now() - INTERVAL '10 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

  - orgId: 1
    name: microgrow-p1-sensor-coverage
    folder: MicroGrow Alerts
    interval: 2m
    rules:
      - uid: alert-air-offline
        title: "Sensores de Ar Offline > 10min"
        condition: C
        for: 10m
        labels:
          severity: critical
          component: sensor
        annotations:
          summary: "Nenhuma leitura de sensores de ar nos últimos 10 minutos"
          description: "Verificar: conexão MQTT, sensor DHT/BME de temperatura/umidade do ar."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT COUNT(*) AS value FROM air_conditions
                WHERE source = 'sim' AND time >= now() - INTERVAL '10 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-light-schedule-violation
        title: "Ciclo de Luz Fora do Schedule > 15min"
        condition: C
        for: 15m
        labels:
          severity: warning
          component: lights
        annotations:
          summary: "Estado das luzes diverge do photoperiod por mais de 15 minutos"
          description: "Verificar: controlador de luz, relé, configuração de photoperiod na API."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              # `compliant` corrigido pra comparação booleana (2026-09-18): campo
              # boolean puro no payload (não é tag). Achado real relacionado ao
              # bug do pump_events (mesma classe: Telegraf json clássico descarta
              # bool não reivindicado por tag_keys) -- fix de config (json_v2)
              # delegado ao harness-dev/repo microgrow, ver D-2026-09-18-1. Até
              # lá esta query dá "column not found" quando a tabela existir, não
              # "table not found" -- comportamento esperado, não corrigível só
              # aqui.
              rawSql: |
                SELECT COUNT(*) AS value FROM lights_compliance
                WHERE compliant = false AND time >= now() - INTERVAL '15 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

  - orgId: 1
    name: microgrow-p2-automation
    folder: MicroGrow Alerts
    interval: 1m
    rules:
      - uid: alert-air-offline-automation
        title: "Sensores de Ar Offline > 10min (automation)"
        condition: C
        for: 10m
        labels:
          severity: critical
          team: microgrow
        annotations:
          summary: "Sensores de ar sem dados há mais de 10 minutos"
          description: "Verificar SHT31 canopy e intake — cabo ou sensor com falha"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT COUNT(*) AS value FROM air_conditions
                WHERE source = 'sim' AND time >= now() - INTERVAL '10 minutes'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-irrigation-ineffective
        title: "3 Irrigações Consecutivas Inefetivas"
        condition: C
        for: 0m
        labels:
          severity: critical
          team: microgrow
        annotations:
          summary: "3 irrigações seguidas não subiram o VWC"
          description: "Verificar: bomba, mangueiras, nível do reservatório, posição dos emissores"
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              # Bug real corrigido 2026-09-18: `effective` é tag (Telegraf
              # tag_keys em irrigation_outcome), string "true"/"false" no
              # InfluxDB 3, mesma classe do fix de sensor_suspect acima
              # (comparação com boolean literal nunca bate, falso negativo
              # silencioso).
              rawSql: |
                WITH last3 AS (
                  SELECT effective FROM irrigation_outcome
                  WHERE time >= now() - INTERVAL '24 hours'
                  ORDER BY time DESC LIMIT 3
                )
                SELECT COUNT(*) AS value FROM last3 WHERE effective = 'false'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gte
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions

      - uid: alert-grow-cycle-stale
        title: "Grow Cycle sem atualização há 7 dias"
        condition: C
        for: 0m
        labels:
          severity: info
          team: microgrow
        annotations:
          summary: "Ciclo de cultivo não foi atualizado nos últimos 7 dias"
          description: "Verifique se o estágio atual ainda está correto em Settings > Ciclo"
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: influxdb-microgrow
            model:
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              rawSql: |
                SELECT COUNT(*) AS value FROM grow_cycle
                WHERE time >= now() - INTERVAL '7 days'
              format: table
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: classic_conditions
